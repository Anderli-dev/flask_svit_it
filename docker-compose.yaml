services:
  backend:
      container_name: flask_backend_app
      build:
        dockerfile: Dockerfile
        args:
          APP_PORT: ${APP_PORT}
      environment:
        - APP_PORT=${APP_PORT}
      restart: always
      ports:
        - '${APP_PORT}:${APP_PORT}'
      depends_on:
        postgres:
          condition: service_healthy
      volumes:
        - .:/backend
      healthcheck:
        test: ['CMD', 'curl', '-f', 'http://localhost:5000/']
        interval: 30s
        timeout: 10s
        start_period: 10s
        retries: 3
  postgres:
      image: postgres:latest
      container_name: flask_postgres_db
      restart: always
      env_file:
        - .env
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
      ports:
        - "${POSTGRES_PORT}:${POSTGRES_PORT}"